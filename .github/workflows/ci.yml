name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      moleditpy_ref:
        description: 'MoleditPy branch, tag, or full commit SHA (blank uses repository default)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  MOLEDITPY_REF: ${{ inputs.moleditpy_ref || vars.MOLEDITPY_REF || 'main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install numpy pytest rdkit

      - name: Clone main MoleditPy application
        shell: bash
        run: |
          git init "../python_molecular_editor"
          git -C "../python_molecular_editor" remote add origin https://github.com/HiroYokoyama/python_molecular_editor.git
          git -C "../python_molecular_editor" fetch --depth 1 origin "$MOLEDITPY_REF"
          git -C "../python_molecular_editor" checkout --detach FETCH_HEAD
          git -C "../python_molecular_editor" log -1 --format="%H %s"

      - name: Run tests
        run: pytest tests/ -v


  test-real-qt:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt and VTK system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install real GUI dependencies
        run: pip install pytest numpy rdkit PySide6-Essentials pyvista
      - name: Run native Qt regressions
        run: python -m pytest tests_gui/ -q --tb=short
